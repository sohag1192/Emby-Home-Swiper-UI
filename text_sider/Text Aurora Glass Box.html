<style>

    .sn-aurora-wrapper {

        border-color: rgba(255, 255, 255, 0.28);

    @keyframes sn-aurora-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Ambient Shimmer Light Bar across Top */
    .sn-aurora-wrapper::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);

</style>

<script>
(function () {
    'use strict';
    const cardWrapperId = "sn-aurora-vip-wrapper";

    // Universal selector for Emby & Jellyfin (Desktop & Mobile)
    function getMainButtonsElement() {
        return document.querySelector(
            // Emby Desktop (inside emby-scroller)
            "div[is='emby-scroller']:not(.hide) .mainDetailButtons:not(.hide), " +
            // Emby Mobile (emby-scroller is absent or inside .itemDetailPage / .page)
            "div.itemDetailPage:not(.hide) .mainDetailButtons:not(.hide), " +
            "div.page:not(.hide) .mainDetailButtons:not(.hide), " +
            ".detailRibbon:not(.hide) .mainDetailButtons:not(.hide), " +
            ".mainDetailButtons:not(.hide), " +
            ".mainDetailButtons, " +
            // Jellyfin Desktop & Mobile
            "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer:not(.hide), " +
            "div.itemDetailPage:not(.hide) .detailPagePrimaryContent:not(.hide), " +
            ".detailPagePrimaryContainer:not(.hide), " +
            ".detailPagePrimaryContainer, " +
            // Custom skins & fallbacks
            "div.itemDetailPage:not(.hide) .detailRibbon:not(.hide), " +
            ".detailRibbon"
        );
    }

    function isItemDetailPage(e) {
        if (e && e.detail) {
            if (e.detail.type === "itemdetail") return true;
            if (e.detail.contextPath && (e.detail.contextPath.includes("item?id=") || e.detail.contextPath.startsWith("/item"))) return true;
            if (e.detail.path && (e.detail.path.includes("item?id=") || e.detail.path.startsWith("/item"))) return true;
            if (e.detail.params && (e.detail.params.id || e.detail.params.itemId)) return true;
        }
        const hash = window.location.hash || "";
        const href = window.location.href || "";
        return hash.includes("item?id=") || hash.includes("#!/item") || href.includes("/item?id=") || href.includes("#!/item");
    }

    function initAuroraCard() {
        if (!isItemDetailPage()) return false;

        const mainDetailButtons = getMainButtonsElement();
        if (!mainDetailButtons) return false;

        let existing = document.getElementById(cardWrapperId);
        if (existing) {
            if (existing.previousElementSibling === mainDetailButtons || existing.parentElement === mainDetailButtons.parentElement) {
                return true;
            }
            existing.remove();
        }

        const cardHtml = `
            <div id="${cardWrapperId}" class="sn-aurora-wrapper" role="alert">
                <div class="sn-aurora-header">
                    <div class="sn-aurora-title-wrap">
                        <span class="sn-aurora-icon">✨</span>
                        <h4 class="sn-aurora-title">ভিআইপি নোটিশ <span class="sn-title-sub">| VIP Notice</span></h4>
                    </div>
                    <div class="sn-aurora-header-right">
                        <span class="sn-aurora-status"><span class="sn-aurora-dot"></span>HIGH SPEED CDN</span>
                        <button class="sn-aurora-close" title="Dismiss" aria-label="Close" onclick="this.closest('.sn-aurora-wrapper')?.remove();">✕</button>
                    </div>
                </div>

                <div class="sn-aurora-chips">
                    <span class="sn-chip sn-chip-red">🎬 4K UHD DIRECT</span>
                    <span class="sn-chip sn-chip-blue">⚡ ZERO BUFFER</span>
                    <span class="sn-chip sn-chip-purple">🚀 10G BDIX PORTAL</span>
                </div>

                <div class="sn-aurora-body">
                    <p class="sn-aurora-text">
                        <span class="sn-lang-badge sn-lang-bn">বাংলা</span> বাফারিং এড়াতে 10G BDIX ফুল স্পিডে 4K স্ট্রিমিং ও দ্রুত ডাউনলোডের জন্য <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a> ব্যবহার করুন। পছন্দের মুভি বা সিরিজ রিকুয়েস্ট করতে <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank">Movies Request</a> বাটনে ক্লিক করুন।
                    </p>
                    <p class="sn-aurora-text">
                        <span class="sn-lang-badge sn-lang-en">ENG</span> To bypass buffering and enjoy direct 10G BDIX 4K streaming or downloads, use <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a>. Tap <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank">Movies Request</a> for any missing movie or TV show.
                    </p>
                </div>

                <div class="sn-aurora-actions">
                    <a href="http://100.100.100.6/#SN_CDN" target="_blank" class="sn-aurora-btn sn-btn-portal">
                        🚀 Open SN File Server
                    </a>
                    <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank" class="sn-aurora-btn sn-btn-telegram">
                        🎬 Movies Request
                    </a>
                </div>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", cardHtml);
        return true;
    }

    let activeObserver = null;
    let fallbackInterval = null;

    function startWatcher(e) {
        if (!isItemDetailPage(e)) return;

        if (initAuroraCard()) return;

        if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
        if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }

        let attempts = 0;
        const maxAttempts = 50;

        activeObserver = new MutationObserver(function () {
            attempts++;
            if (initAuroraCard() || attempts >= maxAttempts) {
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
            }
        });

        activeObserver.observe(document.body, { childList: true, subtree: true });

        fallbackInterval = setInterval(function () {
            attempts++;
            if (initAuroraCard() || attempts >= maxAttempts) {
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
            }
        }, 120);
    }

    document.addEventListener("viewbeforeshow", startWatcher);
    document.addEventListener("viewshow", startWatcher);
    window.addEventListener("hashchange", function () { startWatcher(); });
    window.addEventListener("popstate", function () { startWatcher(); });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { startWatcher(); });
    } else {
        startWatcher();
    }
})();
</script>
