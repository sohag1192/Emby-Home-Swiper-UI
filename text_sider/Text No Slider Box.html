<style>
    /* ========================================================
       📢 Premium Glassmorphism Notice Card (text_sider)
       Supports Emby & Jellyfin Web | Fully Responsive & Mobile-Ready
       ======================================================== */
    .sn-card-wrapper {
        width: 100%;
        box-sizing: border-box;
        background: linear-gradient(135deg, rgba(229, 9, 20, 0.12) 0%, rgba(18, 18, 22, 0.92) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        position: relative;
        z-index: 10;
        clear: both;
        transition: all 0.3s ease;
    }

    .sn-card-wrapper:hover {

    }

    .sn-card-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }

    .sn-brand-icon {
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: rgba(229, 9, 20, 0.18);
        border: 1px solid rgba(229, 9, 20, 0.4);
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(229, 9, 20, 0.25);
        flex-shrink: 0;
    }

    .sn-card-title {
        font-size: clamp(14px, 1.2vw, 17px);
        font-weight: 800;
        color: #ff9b9b;
        letter-spacing: 0.3px;
        margin: 0;
        line-height: 1.2;
    }

    .sn-card-sub {
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.45);
        margin-left: 6px;
        letter-spacing: 0.2px;
    }

    .sn-header-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .sn-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(70, 211, 105, 0.15);
        border: 1px solid rgba(70, 211, 105, 0.4);
        color: #46d369;
        font-size: 10.5px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        user-select: none;
        white-space: nowrap;
    }

    .sn-pulse-green {
        width: 6px;
        height: 6px;
        background-color: #46d369;
        border-radius: 50%;
        box-shadow: 0 0 6px #46d369;
        animation: sn-pulse-anim 1.5s infinite;
    }

    @keyframes sn-pulse-anim {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.5; }
    }

    .sn-card-close {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.45);
        font-size: 15px;
        cursor: pointer;
        padding: 4px 6px;
        line-height: 1;
        border-radius: 4px;
        transition: all 0.2s ease;
    }

    .sn-card-close:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.15);
    }

    /* Content Rows */
    .sn-card-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .sn-info-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
    }

    .sn-row-icon {
        font-size: 15px;
        line-height: 1.4;
        flex-shrink: 0;
    }

    .sn-row-text {
        font-size: clamp(12.5px, 1.05vw, 14.5px);
        font-weight: 500;
        color: #e5e5e5;
        line-height: 1.5;
        margin: 0;
    }

    .sn-row-text strong {
        color: #ffffff;
        font-weight: 700;
    }

    .sn-row-text a {
        color: #ff7676;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.2s ease;
    }

    .sn-row-text a:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    .sn-en-hint {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.9em;
        font-weight: 500;
        margin-left: 4px;
    }

    /* Action Buttons Row */
    .sn-card-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 2px;
    }

    .sn-btn {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
        user-select: none;
    }

    .sn-btn-primary {
        background: linear-gradient(135deg, #e50914 0%, #b80610 100%);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(229, 9, 20, 0.35);
    }

    .sn-btn-primary:hover {
        background: linear-gradient(135deg, #f40612 0%, #cc0813 100%);
        box-shadow: 0 6px 16px rgba(229, 9, 20, 0.5);
        transform: translateY(-1px);
        color: #ffffff;
        text-decoration: none;
    }

    .sn-btn-pill {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffd2d2;
        font-size: 10px;
        font-weight: 800;
        padding: 1.5px 6px;
        border-radius: 12px;
        letter-spacing: 0.4px;
        margin-left: 2px;
    }

    .sn-btn-request {
        background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(0, 136, 204, 0.35);
    }

    .sn-btn-request:hover {
        background: linear-gradient(135deg, #0099e6 0%, #0077b3 100%);
        box-shadow: 0 6px 16px rgba(0, 136, 204, 0.5);
        transform: translateY(-1px);
        color: #ffffff;
        text-decoration: none;
    }

    /* 📱 Responsive Mobile View */
    @media (max-width: 600px) {
        .sn-card-wrapper {
            padding: 10px 12px;
            gap: 8px;
            margin: 10px 0 8px 0;
            border-radius: 9px;
            box-sizing: border-box;
        }

        .sn-card-header {
            padding-bottom: 6px;
            flex-wrap: nowrap;
            gap: 6px;
        }

        .sn-card-brand {
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .sn-brand-icon {
            width: 24px;
            height: 24px;
            font-size: 14px;
        }

        .sn-card-title {
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sn-card-sub {
            display: none;
        }

        .sn-header-right {
            gap: 6px;
        }

        .sn-status-pill {
            font-size: 9.5px;
            padding: 2px 6px;
            gap: 4px;
        }

        .sn-pulse-green {
            width: 5px;
            height: 5px;
        }

        .sn-card-close {
            font-size: 14px;
            padding: 2px 4px;
        }

        .sn-card-body {
            gap: 5px;
        }

        .sn-info-row {
            gap: 6px;
        }

        .sn-row-icon {
            font-size: 14px;
            line-height: 1.35;
        }

        .sn-row-text {
            font-size: 12px;
            line-height: 1.4;
            letter-spacing: -0.1px;
        }

        .sn-en-hint {
            display: block;
            font-size: 11px;
            margin-left: 0;
            margin-top: 1px;
        }

        .sn-card-actions {
            flex-direction: column;
            width: 100%;
            gap: 6px;
            margin-top: 2px;
        }

        .sn-btn {
            width: 100%;
            padding: 9px 12px;
            font-size: 13px;
            box-sizing: border-box;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sn-btn-request {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
    }
</style>

<script>
(function () {
    'use strict';
    const cardWrapperId = "sn-text-card-wrapper";

    // Universal selector for Emby & Jellyfin (Desktop & Mobile)
    function getMainButtonsElement() {
        return document.querySelector(
            // Emby Desktop (inside emby-scroller)
            "div[is='emby-scroller']:not(.hide) .mainDetailButtons:not(.hide), " +
            // Emby Mobile (emby-scroller is absent or inside .itemDetailPage / .page)
            "div.itemDetailPage:not(.hide) .mainDetailButtons:not(.hide), " +
            "div.page:not(.hide) .mainDetailButtons:not(.hide), " +
            ".detailRibbon:not(.hide) .mainDetailButtons:not(.hide), " +
            ".mainDetailButtons:not(.hide), " +
            ".mainDetailButtons, " +
            // Jellyfin Desktop & Mobile
            "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer:not(.hide), " +
            "div.itemDetailPage:not(.hide) .detailPagePrimaryContent:not(.hide), " +
            ".detailPagePrimaryContainer:not(.hide), " +
            ".detailPagePrimaryContainer, " +
            // Custom skins & fallbacks
            "div.itemDetailPage:not(.hide) .detailRibbon:not(.hide), " +
            ".detailRibbon"
        );
    }

    function isItemDetailPage(e) {
        if (e && e.detail) {
            if (e.detail.type === "itemdetail") return true;
            if (e.detail.contextPath && (e.detail.contextPath.includes("item?id=") || e.detail.contextPath.startsWith("/item"))) return true;
            if (e.detail.path && (e.detail.path.includes("item?id=") || e.detail.path.startsWith("/item"))) return true;
            if (e.detail.params && (e.detail.params.id || e.detail.params.itemId)) return true;
        }
        const hash = window.location.hash || "";
        const href = window.location.href || "";
        return hash.includes("item?id=") || hash.includes("#!/item") || href.includes("/item?id=") || href.includes("#!/item");
    }

    function initNoticeCard() {
        if (!isItemDetailPage()) return false;

        const mainDetailButtons = getMainButtonsElement();
        if (!mainDetailButtons) return false;

        let existing = document.getElementById(cardWrapperId);
        if (existing) {
            if (existing.previousElementSibling === mainDetailButtons || existing.parentElement === mainDetailButtons.parentElement) {
                return true;
            }
            existing.remove();
        }

        const cardHtml = `
            <div id="${cardWrapperId}" class="sn-card-wrapper" role="alert">
                <div class="sn-card-header">
                    <div class="sn-card-brand">
                        <span class="sn-brand-icon">⚡</span>
                        <h4 class="sn-card-title">10G BDIX সার্ভার নোটিশ <span class="sn-card-sub">| High-Speed Portal</span></h4>
                    </div>
                    <div class="sn-header-right">
                        <span class="sn-status-pill"><span class="sn-pulse-green"></span>ONLINE</span>
                        <button class="sn-card-close" title="Dismiss" aria-label="Close" onclick="this.closest('.sn-card-wrapper')?.remove();">✕</button>
                    </div>
                </div>

                <div class="sn-card-body">
                    <div class="sn-info-row">
                        <span class="sn-row-icon">🚀</span>
                        <p class="sn-row-text">
                            বাফারিং ছাড়া <strong>4K স্ট্রিমিং</strong> ও <strong>ফুল স্পিড ডাউনলোডে</strong> <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a> ব্যবহার করুন।
                            <span class="sn-en-hint">(Zero-buffer 10G BDIX 4K playback & IDM download)</span>
                        </p>
                    </div>
                    <div class="sn-info-row">
                        <span class="sn-row-icon">🎬</span>
                        <p class="sn-row-text">
                            পছন্দের কোনো মুভি বা ওয়েব সিরিজ সার্ভারে খুঁজে না পেলে <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank">Movies Request</a> বাটনে ক্লিক করুন।
                            <span class="sn-en-hint">(Tap Movies Request for missing titles)</span>
                        </p>
                    </div>
                </div>

                <div class="sn-card-actions">
                    <a href="http://100.100.100.6/#SN_CDN" target="_blank" class="sn-btn sn-btn-primary">
                        🚀 Open SN File Server <span class="sn-btn-pill">10G BDIX</span>
                    </a>
                    <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank" class="sn-btn sn-btn-request">
                        🎬 Movies Request
                    </a>
                </div>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", cardHtml);
        return true;
    }

    let activeObserver = null;
    let fallbackInterval = null;

    function startWatcher(e) {
        if (!isItemDetailPage(e)) return;

        if (initNoticeCard()) return;

        if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
        if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }

        let attempts = 0;
        const maxAttempts = 50;

        activeObserver = new MutationObserver(function () {
            attempts++;
            if (initNoticeCard() || attempts >= maxAttempts) {
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
            }
        });

        activeObserver.observe(document.body, { childList: true, subtree: true });

        fallbackInterval = setInterval(function () {
            attempts++;
            if (initNoticeCard() || attempts >= maxAttempts) {
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
            }
        }, 120);
    }

    document.addEventListener("viewbeforeshow", startWatcher);
    document.addEventListener("viewshow", startWatcher);
    window.addEventListener("hashchange", function () { startWatcher(); });
    window.addEventListener("popstate", function () { startWatcher(); });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { startWatcher(); });
    } else {
        startWatcher();
    }
})();
</script>
