<style>
    /* ========================================================
       📢 Premium Glassmorphism Notice Card (text_sider)
       Supports Emby & Jellyfin Web | Fully Responsive & Mobile-Ready
       ======================================================== */
    .sn-card-wrapper {

        box-sizing: border-box;
        background: linear-gradient(135deg, rgba(255, 60, 60, 0.12) 0%, rgba(20, 20, 20, 0.85) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 80, 80, 0.35);
        border-left: 4px solid #ff4747;
        border-radius: 12px;
        padding: 16px 20px;
        margin: 18px 0 14px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 71, 71, 0.15);
        position: relative;
        z-index: 10;
        clear: both;
        transition: all 0.3s ease;
    }

    .sn-card-wrapper:hover {
        border-color: rgba(255, 90, 90, 0.6);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 71, 71, 0.25);
    }

    /* Card Header */
    .sn-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sn-card-title-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .sn-card-icon {
        font-size: 20px;
        line-height: 1;
    }

    .sn-card-title {
        font-size: clamp(15px, 1.3vw, 19px);
        font-weight: 800;
        color: #ff9b9b;
        letter-spacing: 0.3px;
        margin: 0;
        line-height: 1.2;
    }

    .sn-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(70, 211, 105, 0.15);
        border: 1px solid rgba(70, 211, 105, 0.4);
        color: #46d369;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        user-select: none;
    }

    .sn-pulse-green {
        width: 6px;
        height: 6px;
        background-color: #46d369;
        border-radius: 50%;
        box-shadow: 0 0 6px #46d369;
        animation: sn-pulse-anim 1.5s infinite;
    }

    @keyframes sn-pulse-anim {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.5; }
    }

    .sn-card-close {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
        line-height: 1;
        border-radius: 4px;
        transition: all 0.2s ease;
    }

    .sn-card-close:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.15);
    }

    /* Badges Bar */
    .sn-card-chips {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .sn-chip {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        letter-spacing: 0.4px;
    }

    .sn-chip-red { background: rgba(255, 71, 71, 0.18); color: #ff8585; border: 1px solid rgba(255, 71, 71, 0.4); }
    .sn-chip-green { background: rgba(70, 211, 105, 0.18); color: #6ee7b7; border: 1px solid rgba(70, 211, 105, 0.4); }
    .sn-chip-blue { background: rgba(0, 180, 255, 0.18); color: #72d6ff; border: 1px solid rgba(0, 180, 255, 0.4); }

    /* Card Body */
    .sn-card-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sn-lang-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 4px;
        letter-spacing: 0.4px;
        margin-right: 6px;
        vertical-align: middle;
    }

    .sn-lang-bn {
        background: rgba(255, 90, 90, 0.15);
        color: #ff9b9b;
        border: 1px solid rgba(255, 90, 90, 0.4);
    }

    .sn-lang-en {
        background: rgba(255, 255, 255, 0.1);
        color: #e5e5e5;
        border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .sn-lang-block {
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 500;
        color: #e5e5e5;
        line-height: 1.6;
        margin: 0;
    }

    .sn-lang-block strong {
        color: #ffffff;
    }

    .sn-lang-block a {
        color: #ff7676;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.2s ease;
    }

    .sn-lang-block a:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    /* Action Buttons Row */
    .sn-card-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
    }

    .sn-btn {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
        user-select: none;
    }

    .sn-btn-primary {
        background: linear-gradient(135deg, #e50914 0%, #b80610 100%);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(229, 9, 20, 0.35);
    }

    .sn-btn-primary:hover {
        background: linear-gradient(135deg, #f40612 0%, #cc0813 100%);
        box-shadow: 0 6px 16px rgba(229, 9, 20, 0.5);
        transform: translateY(-1px);
        color: #ffffff;
        text-decoration: none;
    }

    .sn-btn-request {
        background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(0, 136, 204, 0.35);
    }

    .sn-btn-request:hover {
        background: linear-gradient(135deg, #0099e6 0%, #0077b3 100%);
        box-shadow: 0 6px 16px rgba(0, 136, 204, 0.5);
        transform: translateY(-1px);
        color: #ffffff;
        text-decoration: none;
    }

    /* 📱 Responsive Mobile View */
    @media (max-width: 600px) {
        .sn-card-wrapper {
            padding: 12px 14px;
            gap: 10px;
            margin: 14px 0 10px 0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .sn-card-header {
            padding-bottom: 8px;
        }

        .sn-status-pill {
            font-size: 10px;
            padding: 2px 6px;
        }

        .sn-card-actions {
            flex-direction: column;
            width: 100%;
            gap: 8px;
        }

        .sn-btn {
            width: 100%;
            padding: 11px 14px;
            font-size: 13.5px;
            box-sizing: border-box;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sn-btn-request {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
    }
</style>

<script>
(function () {
    'use strict';
    const cardWrapperId = "sn-text-card-wrapper";

    // Universal selector for Emby & Jellyfin (Desktop & Mobile)
    function getMainButtonsElement() {
        return document.querySelector(
            // Emby Desktop (inside emby-scroller)
            "div[is='emby-scroller']:not(.hide) .mainDetailButtons:not(.hide), " +
            // Emby Mobile (emby-scroller is absent or inside .itemDetailPage / .page)
            "div.itemDetailPage:not(.hide) .mainDetailButtons:not(.hide), " +
            "div.page:not(.hide) .mainDetailButtons:not(.hide), " +
            ".detailRibbon:not(.hide) .mainDetailButtons:not(.hide), " +
            ".mainDetailButtons:not(.hide), " +
            ".mainDetailButtons, " +
            // Jellyfin Desktop & Mobile
            "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer:not(.hide), " +
            "div.itemDetailPage:not(.hide) .detailPagePrimaryContent:not(.hide), " +
            ".detailPagePrimaryContainer:not(.hide), " +
            ".detailPagePrimaryContainer, " +
            // Custom skins & fallbacks
            "div.itemDetailPage:not(.hide) .detailRibbon:not(.hide), " +
            ".detailRibbon"
        );
    }

    function isItemDetailPage(e) {
        if (e && e.detail) {
            if (e.detail.type === "itemdetail") return true;
            if (e.detail.contextPath && (e.detail.contextPath.includes("item?id=") || e.detail.contextPath.startsWith("/item"))) return true;
            if (e.detail.path && (e.detail.path.includes("item?id=") || e.detail.path.startsWith("/item"))) return true;
            if (e.detail.params && (e.detail.params.id || e.detail.params.itemId)) return true;
        }
        const hash = window.location.hash || "";
        const href = window.location.href || "";
        return hash.includes("item?id=") || hash.includes("#!/item") || href.includes("/item?id=") || href.includes("#!/item");
    }

    function initNoticeCard() {
        if (!isItemDetailPage()) return false;

        const mainDetailButtons = getMainButtonsElement();
        if (!mainDetailButtons) return false;

        let existing = document.getElementById(cardWrapperId);
        if (existing) {
            if (existing.previousElementSibling === mainDetailButtons || existing.parentElement === mainDetailButtons.parentElement) {
                return true;
            }
            existing.remove();
        }

        const cardHtml = `
            <div id="${cardWrapperId}" class="sn-card-wrapper" role="alert">
                <div class="sn-card-header">
                    <div class="sn-card-title-group">
                        <span class="sn-card-icon">📢</span>
                        <h4 class="sn-card-title">জরুরী বিজ্ঞপ্তি | Important Notice</h4>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="sn-status-pill"><span class="sn-pulse-green"></span>CDN ONLINE</span>
                        <button class="sn-card-close" title="Dismiss" aria-label="Close" onclick="this.closest('.sn-card-wrapper')?.remove();">✕</button>
                    </div>
                </div>

                <div class="sn-card-chips">
                    <span class="sn-chip sn-chip-red">🎬 4K UHD DIRECT</span>
                    <span class="sn-chip sn-chip-green">⚡ ZERO BUFFER</span>
                    <span class="sn-chip sn-chip-blue">🚀 10G BDIX PORTAL</span>
                </div>

                <div class="sn-card-body">
                    <p class="sn-lang-block">
                        <span class="sn-lang-badge sn-lang-bn">বাংলা</span> <strong>প্রিয় গ্রাহক:</strong> পিক-আওয়ারে বা অতিরিক্ত ট্রাফিকের সময় বাফারিং এড়াতে এবং 10G BDIX ফুল স্পিডে ডিরেক্ট 4K প্লেব্যাক ও ডাউনলোডের জন্য <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a> ব্যবহার করুন। পছন্দের মিডিয়া রিকুয়েস্ট করতে টেলিগ্রাম বাটনে ক্লিক করুন।
                    </p>
                    <p class="sn-lang-block">
                        <span class="sn-lang-badge sn-lang-en">ENG</span> <strong>Notice:</strong> To bypass server bottleneck and experience direct 10G BDIX high-speed 4K streaming or downloads, access our <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a>. Request any missing movie or TV show on Telegram.
                    </p>
                </div>

                <div class="sn-card-actions">
                    <a href="http://100.100.100.6/#SN_CDN" target="_blank" class="sn-btn sn-btn-primary">
                        🚀 Open SN File Server
                    </a>
                    <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank" class="sn-btn sn-btn-request">
                        💬 Telegram Request
                    </a>
                </div>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", cardHtml);
        return true;
    }

    let activeObserver = null;
    let fallbackInterval = null;

    function startWatcher(e) {
        if (!isItemDetailPage(e)) return;

        if (initNoticeCard()) return;

        if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
        if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }

        let attempts = 0;
        const maxAttempts = 50;

        activeObserver = new MutationObserver(function () {
            attempts++;
            if (initNoticeCard() || attempts >= maxAttempts) {
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
            }
        });

        activeObserver.observe(document.body, { childList: true, subtree: true });

        fallbackInterval = setInterval(function () {
            attempts++;
            if (initNoticeCard() || attempts >= maxAttempts) {
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
            }
        }, 120);
    }

    document.addEventListener("viewbeforeshow", startWatcher);
    document.addEventListener("viewshow", startWatcher);
    window.addEventListener("hashchange", function () { startWatcher(); });
    window.addEventListener("popstate", function () { startWatcher(); });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { startWatcher(); });
    } else {
        startWatcher();
    }
})();
</script>
