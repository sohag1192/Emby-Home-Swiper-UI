<style>
    /* ========================================================
       📢 Premium Glassmorphism Notice Card (text_sider)
       Supports Emby & Jellyfin Web | Fully Responsive & Mobile-Ready
       ======================================================== */
    .sn-card-wrapper {
        width: 100%;
        box-sizing: border-box;
        background: linear-gradient(135deg, rgba(255, 60, 60, 0.12) 0%, rgba(20, 20, 20, 0.85) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 80, 80, 0.35);
        border-left: 4px solid #ff4747;
        border-radius: 12px;
        padding: 16px 20px;
        margin: 18px 0 14px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 71, 71, 0.15);
        position: relative;
        z-index: 10;
        clear: both;
        transition: all 0.3s ease;
    }

    .sn-card-wrapper:hover {
        border-color: rgba(255, 90, 90, 0.6);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 71, 71, 0.25);
    }

    /* Card Header */
    .sn-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sn-card-title-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .sn-card-icon {
        font-size: 20px;
        line-height: 1;
    }

    .sn-card-title {
        font-size: clamp(15px, 1.3vw, 19px);
        font-weight: 800;
        color: #ff9b9b;
        letter-spacing: 0.3px;
        margin: 0;
        line-height: 1.2;
    }

    .sn-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(70, 211, 105, 0.15);
        border: 1px solid rgba(70, 211, 105, 0.4);
        color: #46d369;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        user-select: none;
    }

    .sn-pulse-green {
        width: 6px;
        height: 6px;
        background-color: #46d369;
        border-radius: 50%;
        box-shadow: 0 0 6px #46d369;
        animation: sn-pulse-anim 1.5s infinite;
    }

    @keyframes sn-pulse-anim {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.5; }
    }

    .sn-card-close {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
        line-height: 1;
        border-radius: 4px;
        transition: all 0.2s ease;
    }

    .sn-card-close:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.15);
    }

    /* Card Body */
    .sn-card-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sn-lang-block {
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 500;
        color: #e5e5e5;
        line-height: 1.6;
        margin: 0;
    }

    .sn-lang-block strong {
        color: #ffffff;
    }

    .sn-lang-block a {
        color: #ff7676;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.2s ease;
    }

    .sn-lang-block a:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    /* Action Buttons Row */
    .sn-card-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
    }

    .sn-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
        user-select: none;
    }

    .sn-btn-primary {
        background: linear-gradient(135deg, #e50914 0%, #b80610 100%);
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(229, 9, 20, 0.35);
    }

    .sn-btn-primary:hover {
        background: linear-gradient(135deg, #f40612 0%, #cc0813 100%);
        box-shadow: 0 6px 16px rgba(229, 9, 20, 0.5);
        transform: translateY(-1px);
        color: #ffffff;
        text-decoration: none;
    }

    .sn-btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sn-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-1px);
        color: #ffffff;
        text-decoration: none;
    }

    /* 📱 Responsive Mobile View */
    @media (max-width: 600px) {
        .sn-card-wrapper {
            padding: 12px 14px;
            gap: 10px;
            margin: 14px 0 10px 0;
            border-radius: 8px;
        }

        .sn-card-header {
            padding-bottom: 8px;
        }

        .sn-status-pill {
            font-size: 10px;
            padding: 2px 6px;
        }

        .sn-card-actions {
            flex-direction: column;
            width: 100%;
        }

        .sn-btn {
            width: 100%;
            padding: 9px 12px;
            font-size: 13px;
        }
    }
</style>

<script>
(function () {
    'use strict';
    let isEmby = "";
    const cardWrapperId = "sn-text-card-wrapper";

    const selectors = {
        embyMediaInfoDiv: "div[is='emby-scroller']:not(.hide) .mediaInfo:not(.hide)",
        jellfinMediaInfoDiv: ".itemMiscInfo-primary:not(.hide)",
        embyMainDetailButtons: "div[is='emby-scroller']:not(.hide) .mainDetailButtons",
        jellfinMainDetailButtons: "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer, div.itemDetailPage:not(.hide) .mainDetailButtons",
    };

    function showFlag() {
        let mediaInfoDiv = document.querySelector(selectors.embyMediaInfoDiv);
        if (!isEmby) {
            mediaInfoDiv = document.querySelector(selectors.jellfinMediaInfoDiv);
        }
        return !!mediaInfoDiv;
    }

    function copyToClipboard(btn, text) {
        function showSuccess() {
            if (btn) {
                const originalHtml = btn.getAttribute("data-original-html") || btn.innerHTML;
                btn.setAttribute("data-original-html", originalHtml);
                btn.innerHTML = "✅ Copied!";
                btn.style.borderColor = "#46d369";
                btn.style.color = "#46d369";
                setTimeout(function () {
                    btn.innerHTML = originalHtml;
                    btn.style.borderColor = "";
                    btn.style.color = "";
                }, 2000);
            }
        }

        // Modern Clipboard API (available in HTTPS / Secure Contexts)
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(showSuccess).catch(function () {
                fallbackCopy(text);
            });
        } else {
            // Fallback for HTTP / non-secure contexts & older browsers
            fallbackCopy(text);
        }

        function fallbackCopy(str) {
            let successful = false;
            try {
                const ta = document.createElement("textarea");
                ta.value = str;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                ta.style.top = "-9999px";
                ta.style.opacity = "0";
                ta.setAttribute("readonly", "");
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                successful = document.execCommand("copy");
                document.body.removeChild(ta);
            } catch (err) {
                successful = false;
            }

            if (successful) {
                showSuccess();
            } else {
                window.prompt("Copy Server URL: Ctrl+C, Enter", str);
            }
        }
    }

    // Expose globally so inline onclick handlers can always reach it
    window.snCopyUrl = copyToClipboard;

    function initNoticeCard() {
        let existing = document.getElementById(cardWrapperId);
        if (existing) existing.remove();

        let mainDetailButtons = document.querySelector(selectors.embyMainDetailButtons);
        if (!isEmby) {
            mainDetailButtons = document.querySelector(selectors.jellfinMainDetailButtons);
        }

        if (!mainDetailButtons) return;

        const cardHtml = `
            <div id="${cardWrapperId}" class="sn-card-wrapper" role="alert">
                <div class="sn-card-header">
                    <div class="sn-card-title-group">
                        <span class="sn-card-icon">📢</span>
                        <h4 class="sn-card-title">জরুরী বিজ্ঞপ্তি | Important Notice</h4>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="sn-status-pill"><span class="sn-pulse-green"></span>CDN ONLINE</span>
                        <button class="sn-card-close" title="Dismiss" aria-label="Close" onclick="this.closest('.sn-card-wrapper')?.remove();">✕</button>
                    </div>
                </div>
                <div class="sn-card-body">
                    <p class="sn-lang-block">
                        🇧🇩 <strong>সম্মানিত গ্রাহক:</strong> সার্ভারে অতিরিক্ত চাপের কারণে বাফারিং হতে পারে। নিরবচ্ছিন্ন ফাস্ট স্ট্রিমিং ও ডিরেক্ট ডাউনলোডের জন্য <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a> ব্যবহার করুন।
                    </p>
                    <p class="sn-lang-block">
                        🌐 <strong>Dear User:</strong> If you experience buffering due to high traffic, please use our ultra-fast direct media portal <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a>.
                    </p>
                </div>
                <div class="sn-card-actions">
                    <a href="http://100.100.100.6/#SN_CDN" target="_blank" class="sn-btn sn-btn-primary">
                        🚀 Open SN File Server
                    </a>
                    <button class="sn-btn sn-btn-secondary" onclick="window.snCopyUrl ? window.snCopyUrl(this, 'http://100.100.100.6/') : (function(b,u){var t=document.createElement('textarea');t.value=u;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();try{document.execCommand('copy');b.innerText='✅ Copied!';setTimeout(function(){b.innerText='📋 Copy Server URL';},2000);}catch(e){prompt('Copy URL:',u);}document.body.removeChild(t);})(this, 'http://100.100.100.6/');">
                        📋 Copy Server URL
                    </button>
                </div>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", cardHtml);
    }

    document.addEventListener("viewbeforeshow", function (e) {
        if (isEmby === "") isEmby = !!e.detail.contextPath;
        let isItemDetailPage = isEmby 
            ? (e.detail.contextPath && e.detail.contextPath.startsWith("/item?id=")) 
            : (e.detail.params && e.detail.params.id);
        
        if (isItemDetailPage) {
            const mutation = new MutationObserver(function() {
                if (showFlag()) {
                    initNoticeCard();
                    mutation.disconnect();
                }
            });
            mutation.observe(document.body, { childList: true, characterData: true, subtree: true });
        }
    });
})();
</script>
