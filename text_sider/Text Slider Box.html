<style>
    /* ========================================================
       🎬 Premium Scrolling Ticker / Notice Bar (text_sider)
       Supports Emby & Jellyfin Web | Fully Responsive & Mobile-Ready
       ======================================================== */
    .sn-slider-wrapper {
        width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(255, 60, 60, 0.12) 0%, rgba(20, 20, 20, 0.8) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 80, 80, 0.35);
        border-left: 4px solid #ff4747;
        border-radius: 10px;
        padding: 10px 14px;
        margin: 16px 0 12px 0;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 71, 71, 0.15);
        position: relative;
        z-index: 10;
        transition: all 0.3s ease;
    }

    .sn-slider-wrapper:hover {
        border-color: rgba(255, 90, 90, 0.6);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 71, 71, 0.25);
    }

    /* Pinned Badge on Left */
    .sn-slider-badge {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 71, 71, 0.25);
        border: 1px solid rgba(255, 71, 71, 0.5);
        color: #ff8585;
        font-size: clamp(11px, 1vw, 13px);
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 4px 10px;
        border-radius: 6px;
        text-transform: uppercase;
        user-select: none;
    }

    .sn-pulse-dot {
        width: 8px;
        height: 8px;
        background-color: #ff3838;
        border-radius: 50%;
        box-shadow: 0 0 8px #ff3838;
        animation: sn-dot-pulse 1.6s infinite cubic-bezier(0.45, 0, 0.55, 1);
    }

    @keyframes sn-dot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Ticker Track with Gradient Fade Edges */
    .sn-marquee-container {
        flex-grow: 1;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
        mask-image: linear-gradient(to right, transparent, #000 20px, #000 calc(100% - 20px), transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, #000 20px, #000 calc(100% - 20px), transparent);
    }

    .sn-slider-content {
        display: inline-block;
        white-space: nowrap;
        will-change: transform;
        animation: sn-marquee-scroll 24s linear infinite;
    }

    /* Pause animation on hover or touch */
    .sn-slider-wrapper:hover .sn-slider-content,
    .sn-slider-wrapper:active .sn-slider-content {
        animation-play-state: paused;
    }

    .sn-slider-content .item {
        font-size: clamp(13px, 1.1vw, 16px);
        font-weight: 500;
        color: #ffffff;
        padding-right: 40px;
        line-height: 1.5;
    }

    .sn-slider-content a {
        color: #ff7676;
        text-decoration: none;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 8px;
        border-radius: 4px;
        border-bottom: 1px solid rgba(255, 118, 118, 0.4);
        transition: all 0.2s ease;
    }

    .sn-slider-content a:hover {
        color: #ffffff;
        background: #ff4747;
        border-bottom-color: transparent;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(255, 71, 71, 0.5);
    }

    .sn-slider-content a.sn-link-request {
        color: #38bdf8;
        border-bottom: 1px solid rgba(56, 189, 248, 0.4);
    }

    .sn-slider-content a.sn-link-request:hover {
        color: #ffffff;
        background: #0088cc;
        border-bottom-color: transparent;
        box-shadow: 0 2px 8px rgba(0, 136, 204, 0.5);
    }

    /* Close / Dismiss Button */
    .sn-slider-close {
        flex-shrink: 0;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-size: 16px;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    .sn-slider-close:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.15);
    }

    /* Scroll Keyframe */
    @keyframes sn-marquee-scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* 📱 Responsive Adjustments */
    @media (max-width: 600px) {
        .sn-slider-wrapper {
            padding: 8px 10px;
            gap: 8px;
            margin: 12px 0 8px 0;
            border-radius: 8px;
        }
        .sn-slider-badge {
            font-size: 10px;
            padding: 3px 6px;
        }
        .sn-slider-content .item {
            font-size: 13px;
        }
    }
</style>

<script>
(function () {
    'use strict';
    let isEmby = "";
    const sliderWrapperId = "sn-text-slider-wrapper";

    const selectors = {
        embyMediaInfoDiv: "div[is='emby-scroller']:not(.hide) .mediaInfo:not(.hide)",
        jellfinMediaInfoDiv: ".itemMiscInfo-primary:not(.hide)",
        embyMainDetailButtons: "div[is='emby-scroller']:not(.hide) .mainDetailButtons",
        jellfinMainDetailButtons: "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer, div.itemDetailPage:not(.hide) .mainDetailButtons",
    };

    function showFlag() {
        let mediaInfoDiv = document.querySelector(selectors.embyMediaInfoDiv);
        if (!isEmby) {
            mediaInfoDiv = document.querySelector(selectors.jellfinMediaInfoDiv);
        }
        return !!mediaInfoDiv;
    }

    function initSlider() {
        let existingSlider = document.getElementById(sliderWrapperId);
        if (existingSlider) {
            existingSlider.remove();
        }

        let mainDetailButtons = document.querySelector(selectors.embyMainDetailButtons);
        if (!isEmby) {
            mainDetailButtons = document.querySelector(selectors.jellfinMainDetailButtons);
        }

        if (!mainDetailButtons) return;

        const noticeText = '⚠️ সার্ভার লোড বেশি এই জন্য ডাউনলোড ও প্লে করতে প্রব্লেম হইতে পারে, সেই জন্য <a href="http://100.100.100.6/" target="_blank">SN FILE SERVER (http://100.100.100.6/)</a> সার্ভার ব্যাবহার করুন। &nbsp; • &nbsp; 💡 Fast Streaming & Direct High-Speed Download Available! &nbsp; • &nbsp; 💬 <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank" class="sn-link-request">Request</a>';

        const sliderHtml = `
            <div id="${sliderWrapperId}" class="sn-slider-wrapper" role="alert">
                <div class="sn-slider-badge">
                    <span class="sn-pulse-dot"></span>
                    <span>NOTICE</span>
                </div>
                <div class="sn-marquee-container">
                    <div class="sn-slider-content">
                        <span class="item">${noticeText}</span>
                        <span class="item" aria-hidden="true">${noticeText}</span>
                    </div>
                </div>
                <button class="sn-slider-close" title="Dismiss" aria-label="Close notice" onclick="this.closest('.sn-slider-wrapper')?.remove();">✕</button>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", sliderHtml);
    }

    document.addEventListener("viewbeforeshow", function (e) {
        if (isEmby === "") {
            isEmby = !!e.detail.contextPath;
        }
        
        let isItemDetailPage = isEmby 
            ? (e.detail.contextPath && e.detail.contextPath.startsWith("/item?id="))
            : (e.detail.params && e.detail.params.id);
        
        if (isItemDetailPage) {
            const mutation = new MutationObserver(function() {
                if (showFlag()) {
                    initSlider();
                    mutation.disconnect();
                }
            });
            mutation.observe(document.body, {
                childList: true,
                characterData: true,
                subtree: true,
            });
        }
    });
})();
</script>
