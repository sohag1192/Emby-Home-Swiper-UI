        background: linear-gradient(135deg, #ffaa00 0%, #d48800 100%);

    .sn-alert-btn:hover {

</style>

<script>
(function () {
    'use strict';
    const alertId = "sn-server-warning-box";

    // Universal selector for Emby & Jellyfin (Desktop & Mobile)
    function getMainButtonsElement() {
        return document.querySelector(
            // Emby Desktop (inside emby-scroller)
            "div[is='emby-scroller']:not(.hide) .mainDetailButtons:not(.hide), " +
            // Emby Mobile (emby-scroller is absent or inside .itemDetailPage / .page)
            "div.itemDetailPage:not(.hide) .mainDetailButtons:not(.hide), " +
            "div.page:not(.hide) .mainDetailButtons:not(.hide), " +
            ".detailRibbon:not(.hide) .mainDetailButtons:not(.hide), " +
            ".mainDetailButtons:not(.hide), " +
            ".mainDetailButtons, " +
            // Jellyfin Desktop & Mobile
            "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer:not(.hide), " +
            "div.itemDetailPage:not(.hide) .detailPagePrimaryContent:not(.hide), " +
            ".detailPagePrimaryContainer:not(.hide), " +
            ".detailPagePrimaryContainer, " +
            // Custom skins & fallbacks
            "div.itemDetailPage:not(.hide) .detailRibbon:not(.hide), " +
            ".detailRibbon"
        );
    }

    function isItemDetailPage(e) {
        if (e && e.detail) {
            if (e.detail.type === "itemdetail") return true;
            if (e.detail.contextPath && (e.detail.contextPath.includes("item?id=") || e.detail.contextPath.startsWith("/item"))) return true;
            if (e.detail.path && (e.detail.path.includes("item?id=") || e.detail.path.startsWith("/item"))) return true;
            if (e.detail.params && (e.detail.params.id || e.detail.params.itemId)) return true;
        }
        const hash = window.location.hash || "";
        const href = window.location.href || "";
        return hash.includes("item?id=") || hash.includes("#!/item") || href.includes("/item?id=") || href.includes("#!/item");
    }

    function initWarningBox() {
        if (!isItemDetailPage()) return false;

        const mainDetailButtons = getMainButtonsElement();
        if (!mainDetailButtons) return false;

        let existing = document.getElementById(alertId);
        if (existing) {
            if (existing.previousElementSibling === mainDetailButtons || existing.parentElement === mainDetailButtons.parentElement) {
                return true;
            }
            existing.remove();
        }

        const alertHTML = `
            <div id="${alertId}" class="sn-server-alert" role="alert">
                <div class="sn-alert-content">
                    <span class="sn-alert-icon">⚠️</span>
                    <span class="sn-alert-text">
                        সার্ভার লোড বেশি এই জন্য ডাউনলোড ও প্লে করতে প্রব্লেম হইতে পারে, সেই জন্য <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a> ব্যাবহার করুন।
                    </span>
                </div>
                <div class="sn-alert-actions">
                    <a href="http://100.100.100.6/#SN_CDN" target="_blank" class="sn-alert-btn">
                        ⚡ Open Server
                    </a>
                    <a href="https://t.me/+Z1HSzcUk_OViM2E1" target="_blank" class="sn-alert-btn sn-alert-btn-request">
                        🎬 Movies Request
                    </a>
                </div>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", alertHTML);
        return true;
    }

    let activeObserver = null;
    let fallbackInterval = null;

    function startWatcher(e) {
        if (!isItemDetailPage(e)) return;

        if (initWarningBox()) return;

        if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
        if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }

        let attempts = 0;
        const maxAttempts = 50;

        activeObserver = new MutationObserver(function () {
            attempts++;
            if (initWarningBox() || attempts >= maxAttempts) {
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
            }
        });

        activeObserver.observe(document.body, { childList: true, subtree: true });

        fallbackInterval = setInterval(function () {
            attempts++;
            if (initWarningBox() || attempts >= maxAttempts) {
                if (fallbackInterval) { clearInterval(fallbackInterval); fallbackInterval = null; }
                if (activeObserver) { activeObserver.disconnect(); activeObserver = null; }
            }
        }, 120);
    }

    document.addEventListener("viewbeforeshow", startWatcher);
    document.addEventListener("viewshow", startWatcher);
    window.addEventListener("hashchange", function () { startWatcher(); });
    window.addEventListener("popstate", function () { startWatcher(); });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { startWatcher(); });
    } else {
        startWatcher();
    }
})();
</script>
