<style>
    /* ========================================================
       ⚠️ Premium Glassmorphism Compact Warning Banner
       Supports Emby & Jellyfin Web | Fully Responsive
       ======================================================== */
    .sn-server-alert {
        width: 100%;
        box-sizing: border-box;
        background: linear-gradient(135deg, rgba(255, 170, 0, 0.12) 0%, rgba(20, 20, 20, 0.85) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 170, 0, 0.35);
        border-left: 4px solid #ffaa00;
        border-radius: 10px;
        padding: 12px 18px;
        margin: 16px 0 12px 0;
        color: #ffffff;
        font-size: clamp(13px, 1.1vw, 15px);
        font-weight: 500;
        line-height: 1.5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 170, 0, 0.15);
        position: relative;
        z-index: 10;
        clear: both;
        transition: all 0.3s ease;
    }

    .sn-server-alert:hover {
        border-color: rgba(255, 170, 0, 0.6);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 170, 0, 0.25);
    }

    .sn-alert-content {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1 1 300px;
    }

    .sn-alert-icon {
        font-size: 20px;
        line-height: 1;
        flex-shrink: 0;
        animation: sn-bounce-slight 2s infinite ease-in-out;
    }

    @keyframes sn-bounce-slight {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }

    .sn-alert-text {
        color: #e5e5e5;
    }

    .sn-alert-text a {
        color: #ffc107;
        text-decoration: none;
        font-weight: 700;
        border-bottom: 1px dotted #ffc107;
        transition: all 0.2s ease;
    }

    .sn-alert-text a:hover {
        color: #ffffff;
        border-bottom-color: transparent;
        text-decoration: underline;
    }

    .sn-alert-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        background: linear-gradient(135deg, #ffaa00 0%, #d48800 100%);
        color: #000000;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(255, 170, 0, 0.35);
        transition: all 0.2s ease;
        flex-shrink: 0;
        user-select: none;
    }

    .sn-alert-btn:hover {
        background: linear-gradient(135deg, #ffbb1a 0%, #e09200 100%);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(255, 170, 0, 0.5);
        color: #000000;
        text-decoration: none;
    }

    /* 📱 Responsive Mobile View */
    @media (max-width: 600px) {
        .sn-server-alert {
            padding: 10px 12px;
            gap: 10px;
            margin: 12px 0 8px 0;
            border-radius: 8px;
        }

        .sn-alert-btn {
            width: 100%;
            padding: 8px 12px;
        }
    }
</style>

<script>
(function () {
    'use strict';
    let isEmby = "";
    const alertId = "sn-server-warning-box";

    const selectors = {
        embyMediaInfoDiv: "div[is='emby-scroller']:not(.hide) .mediaInfo:not(.hide)",
        jellfinMediaInfoDiv: ".itemMiscInfo-primary:not(.hide)",
        embyMainDetailButtons: "div[is='emby-scroller']:not(.hide) .mainDetailButtons",
        jellfinMainDetailButtons: "div.itemDetailPage:not(.hide) div.detailPagePrimaryContainer, div.itemDetailPage:not(.hide) .mainDetailButtons",
    };

    function showFlag() {
        let mediaInfoDiv = document.querySelector(selectors.embyMediaInfoDiv);
        if (!isEmby) {
            mediaInfoDiv = document.querySelector(selectors.jellfinMediaInfoDiv);
        }
        return !!mediaInfoDiv;
    }

    function initWarningBox() {
        let existing = document.getElementById(alertId);
        if (existing) existing.remove();

        let mainDetailButtons = document.querySelector(selectors.embyMainDetailButtons);
        if (!isEmby) {
            mainDetailButtons = document.querySelector(selectors.jellfinMainDetailButtons);
        }

        if (!mainDetailButtons) return;

        const alertHTML = `
            <div id="${alertId}" class="sn-server-alert" role="alert">
                <div class="sn-alert-content">
                    <span class="sn-alert-icon">⚠️</span>
                    <span class="sn-alert-text">
                        সার্ভার লোড বেশি এই জন্য ডাউনলোড ও প্লে করতে প্রব্লেম হইতে পারে, সেই জন্য <a href="http://100.100.100.6/#SN_CDN" target="_blank">SN FILE SERVER</a> ব্যাবহার করুন।
                    </span>
                </div>
                <a href="http://100.100.100.6/#SN_CDN" target="_blank" class="sn-alert-btn">
                    ⚡ Open Server
                </a>
            </div>
        `;

        mainDetailButtons.insertAdjacentHTML("afterend", alertHTML);
    }

    document.addEventListener("viewbeforeshow", function (e) {
        if (isEmby === "") isEmby = !!e.detail.contextPath;
        let isItemDetailPage = isEmby 
            ? (e.detail.contextPath && e.detail.contextPath.startsWith("/item?id=")) 
            : (e.detail.params && e.detail.params.id);
        
        if (isItemDetailPage) {
            const mutation = new MutationObserver(function() {
                if (showFlag()) {
                    initWarningBox();
                    mutation.disconnect();
                }
            });
            mutation.observe(document.body, { childList: true, characterData: true, subtree: true });
        }
    });
})();
</script>
